configuration:
  ui_mode:
    name: Interface de Usuário
    description: >-
      Como a interface web do add-on é servida. 'terminal' é o clássico
      terminal web ttyd (você executa `claude` manualmente). 'vscode' serve o
      VS Code completo no navegador (code-server) com a extensão nativa do
      Claude Code instalada a partir do Open VSX. Ambos os modos compartilham a
      mesma autenticação, servidores MCP e histórico de conversas. Reinicie o
      add-on após alterar.
  remote_control:
    name: Controle Remoto (pelo app móvel do Claude)
    description: >-
      Mantém aqui uma sessão do Claude Code que você pode controlar pelo app do
      Claude ou claude.ai/code, com reinício automático para sobreviver a quedas de
      rede e reinicializações. 'interactive' mantém uma sessão persistente sempre
      pronta; 'server' aguarda conexões e cria sessões sob demanda, permitindo
      iniciar novas pelo celular. Requer login no claude.ai (chaves de API não são
      suportadas). Usa apenas HTTPS de saída, sem abertura de portas.
  enable_mcp:
    name: Habilitar MCP do Home Assistant
    description: >-
      Habilita o servidor MCP do Home Assistant para interação direta com
      entidades e serviços pelo Claude Code. Permite que o Claude consulte
      estados, chame serviços e interaja com sua casa inteligente.
  enable_playwright_mcp:
    name: Habilitar MCP Playwright
    description: >-
      Habilita o servidor MCP Playwright para automação de navegador. Requer o
      add-on "Playwright Browser" instalado e em execução. Permite que o Claude
      navegue em páginas web, preencha formulários, clique em elementos e tire
      screenshots.
  playwright_cdp_host:
    name: Host CDP do Playwright
    description: >-
      Nome do host do add-on Playwright Browser para conexão CDP. Deixe vazio
      para o padrão (playwright-browser). Se a conexão falhar, verifique o
      nome do host do container Playwright Browser (ex: 1016f397-playwright-browser).
  terminal_font_size:
    name: Tamanho da Fonte do Terminal
    description: >-
      Tamanho da fonte do terminal web em pixels (10-24).
      Ajuste para melhor legibilidade no seu monitor.
  terminal_theme:
    name: Tema do Terminal
    description: >-
      Tema de cores do terminal web.
      Escolha 'dark' para fundo escuro ou 'light' para fundo claro.
  terminal_renderer:
    name: Renderizador do terminal (apenas ui_mode 'terminal')
    description: >-
      Como a TUI do Claude Code é desenhada no terminal web. 'fullscreen' usa o
      renderizador de tela alternativa do próprio Claude: rolagem virtualizada e
      suave, sem piscar, mouse funcionando, e a seleção vai sozinha para a área
      de transferência (em http puro o navegador nega o acesso: ali selecione
      segurando Shift e copie com Ctrl+C). 'classic' é o comportamento anterior
      deste fork: seleção com o mouse sem Shift, ao custo de rolagem quebrada em
      aplicações de tela cheia. 'upstream' reproduz o add-on original do Robson
      Felix: a roda percorre o histórico do tmux e a seleção passa pelo copy-mode
      dele. Esta opção prevalece sobre qualquer /tui manual e não se aplica ao
      ui_mode 'vscode'.
  working_directory:
    name: Diretório de Trabalho
    description: >-
      O diretório padrão quando o Claude Code inicia.
      Use /homeassistant para acesso direto aos arquivos de configuração do HA.
  session_persistence:
    name: Persistência de Sessão
    description: >-
      Habilita persistência de sessão via tmux. Quando habilitado, sua sessão
      do terminal sobrevive a atualizações do navegador e desconexões.
      Recomendado para tarefas de longa duração.
  auto_update_claude:
    name: Atualização Automática do Claude Code
    description: >-
      Instala automaticamente a versão mais recente do Claude Code ao iniciar o
      add-on e verifica novamente a cada 12 horas, para receber novos lançamentos
      sem reiniciar. Mantém o Claude Code atualizado sem precisar atualizar a
      versão do add-on.
  memsearch_enabled:
    name: Habilitar MemSearch (memória persistente)
    description: >-
      Dá ao Claude memória semântica entre sessões usando um embedder ONNX local
      e o Milvus Lite — nada sai da sua máquina. Na primeira ativação, instala em
      um venv persistente e baixa o modelo de embeddings (~558 MB). Requer
      arquitetura de 64 bits (amd64 ou aarch64).
  memsearch_model:
    name: Modelo de Embeddings do MemSearch
    description: >-
      Modelo de embeddings usado pelo MemSearch. Padrão 'bge-m3' (multilíngue,
      ~558 MB). Altere apenas se souber que o modelo é compatível com o provedor
      ONNX local.

  maintenance:
    name: Ação de manutenção (executa uma vez e se redefine)
    description: >-
      Funciona como um botão. Escolha uma ação, salve e deixe o Home Assistant
      reiniciar o add-on: a ação roda na inicialização, o relatório fica no log
      do add-on e esta opção volta sozinha para 'none'. 'check_updates' apenas
      informa o que está desatualizado (inclusive o que exige um Rebuild
      completo, como Node, code-server e o CLI do Docker). 'update_all' também
      atualiza tudo o que dá para atualizar a partir do contêiner em execução:
      Claude Code, MemSearch e seu plugin, hass-mcp e os auxiliares Python, os
      servidores MCP do Playwright, os CLIs gh e ha, e a extensão do Claude Code
      para VS Code.

network:
  7681/tcp: Interface web (terminal ttyd ou code-server, conforme ui_mode)
