configuration:
  ui_mode:
    name: User Interface
    description: >-
      How the add-on's Web UI is served. 'terminal' is the classic ttyd web
      terminal (run `claude` yourself). 'vscode' serves full VS Code in the
      browser (code-server) with the native Claude Code extension installed
      from Open VSX. Both modes share the same authentication, MCP servers and
      conversation history. Restart the add-on after changing.
  remote_control:
    name: Remote Control (drive from the Claude mobile app)
    description: >-
      Keep a Claude Code session running here that you can drive from the Claude
      app or claude.ai/code, with a restart loop so it survives network drops and
      reboots. 'interactive' keeps one persistent session always ready to talk to;
      'server' waits for connections and creates sessions on demand, so you can
      start new ones from your phone. Needs a claude.ai login (API keys are not
      supported). Only outbound HTTPS is used, so no port forwarding is required.
  enable_mcp:
    name: Enable Home Assistant MCP
    description: >-
      Enable the Home Assistant MCP server for direct entity and service
      interaction from Claude Code. Allows Claude to query states, call services,
      and interact with your smart home.
  enable_playwright_mcp:
    name: Enable Playwright MCP
    description: >-
      Enable the Playwright MCP server for browser automation. Requires the
      "Playwright Browser" add-on to be installed and running. Allows Claude to
      navigate web pages, fill forms, click elements, and take screenshots.
  playwright_cdp_host:
    name: Playwright CDP Host
    description: >-
      Hostname of the Playwright Browser add-on for CDP connection. Leave empty
      for default (playwright-browser). If connection fails, check the Playwright
      Browser container hostname (e.g., 1016f397-playwright-browser).
  terminal_font_size:
    name: Terminal Font Size
    description: >-
      Font size for the web terminal in pixels (10-24).
      Adjust for readability on your display.
  terminal_theme:
    name: Terminal Theme
    description: >-
      Color theme for the web terminal.
      Choose 'dark' for dark backgrounds or 'light' for light backgrounds.
  terminal_renderer:
    name: Terminal Renderer (ui_mode 'terminal' only)
    description: >-
      How Claude Code's TUI is rendered in the web terminal. 'fullscreen' uses
      Claude's own alternate-screen renderer: smooth virtualized scrolling, no
      flicker, working mouse, and the selection is copied to your clipboard
      automatically (over plain http the browser denies clipboard access — there,
      hold Shift while selecting, then Ctrl+C). 'classic' is this fork's previous
      behaviour: select with the mouse without Shift, at the cost of broken
      scrolling in full-screen apps. 'upstream' matches the original Robson Felix
      add-on: the wheel scrolls tmux history and selection goes through tmux
      copy-mode. This option overrides any manual /tui choice, and does not apply
      to ui_mode 'vscode'.
  working_directory:
    name: Working Directory
    description: >-
      The default working directory when Claude Code starts.
      Use /homeassistant for direct access to HA configuration files.
  session_persistence:
    name: Session Persistence
    description: >-
      Enable tmux session persistence. When enabled, your terminal session
      survives browser refreshes and disconnects. Recommended for long-running tasks.
  auto_update_claude:
    name: Auto-update Claude Code
    description: >-
      Automatically install the latest Claude Code on add-on startup, then
      re-check every 12 hours so new releases are picked up without a restart.
      Keeps Claude Code current without requiring add-on version bumps.
  memsearch_enabled:
    name: Enable MemSearch (persistent memory)
    description: >-
      Give Claude semantic memory across sessions using a local ONNX embedder
      and Milvus Lite — nothing leaves your machine. On first enable it installs
      into a persistent venv and lazily downloads the embedding model (~558 MB).
      Requires a 64-bit architecture (amd64 or aarch64).
  memsearch_model:
    name: MemSearch Embedding Model
    description: >-
      Embedding model used by MemSearch. Default 'bge-m3' (multilingual,
      ~558 MB). Only change this if you know the model is supported by the
      local ONNX provider.
  maintenance:
    name: Maintenance action (runs once, then resets)
    description: >-
      Acts as a button. Pick an action, save, and let Home Assistant restart the
      add-on: the action runs at startup, the report is written to the add-on
      log, and this option resets itself to 'none'. 'check_updates' only reports
      what is out of date (including the parts that need a full Rebuild, such as
      Node, code-server and the Docker CLI). 'update_all' additionally upgrades
      everything that can be updated from the running container: Claude Code,
      MemSearch and its Claude plugin, hass-mcp and the Python helpers, the
      Playwright MCP servers, the gh and ha CLIs, and the Claude Code VS Code
      extension.

network:
  7681/tcp: Web UI (ttyd terminal or code-server, per ui_mode)
