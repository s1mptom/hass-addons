configuration:
  ui_mode:
    name: Interfaz de Usuario
    description: >-
      Cómo se sirve la interfaz web del add-on. 'terminal' es el clásico
      terminal web ttyd (ejecutas `claude` tú mismo). 'vscode' sirve VS Code
      completo en el navegador (code-server) con la extensión nativa de Claude
      Code instalada desde Open VSX. Ambos modos comparten la misma
      autenticación, servidores MCP e historial de conversaciones. Reinicia el
      add-on después de cambiar.
  enable_mcp:
    name: Habilitar MCP de Home Assistant
    description: >-
      Habilita el servidor MCP de Home Assistant para interacción directa con
      entidades y servicios desde Claude Code. Permite que Claude consulte
      estados, llame servicios e interactúe con tu hogar inteligente.
  enable_playwright_mcp:
    name: Habilitar MCP Playwright
    description: >-
      Habilita el servidor MCP Playwright para automatización del navegador. Requiere
      el add-on "Playwright Browser" instalado y ejecutándose. Permite que Claude
      navegue páginas web, complete formularios, haga clic en elementos y tome
      capturas de pantalla.
  playwright_cdp_host:
    name: Host CDP de Playwright
    description: >-
      Nombre del host del add-on Playwright Browser para conexión CDP. Deja vacío
      para el predeterminado (playwright-browser). Si la conexión falla, verifica el
      nombre del host del contenedor Playwright Browser (ej: 1016f397-playwright-browser).
  terminal_font_size:
    name: Tamaño de Fuente del Terminal
    description: >-
      Tamaño de fuente del terminal web en píxeles (10-24).
      Ajusta para mejor legibilidad en tu pantalla.
  terminal_theme:
    name: Tema del Terminal
    description: >-
      Tema de colores del terminal web.
      Elige 'dark' para fondo oscuro o 'light' para fondo claro.
  working_directory:
    name: Directorio de Trabajo
    description: >-
      El directorio predeterminado cuando Claude Code inicia.
      Usa /homeassistant para acceso directo a los archivos de configuración de HA.
  session_persistence:
    name: Persistencia de Sesión
    description: >-
      Habilita persistencia de sesión via tmux. Cuando está habilitado, tu sesión
      del terminal sobrevive a actualizaciones del navegador y desconexiones.
      Recomendado para tareas de larga duración.
  auto_update_claude:
    name: Actualización Automática de Claude Code
    description: >-
      Instala automáticamente la última versión de Claude Code al iniciar el
      add-on y vuelve a comprobar cada 12 horas, para recibir nuevas versiones
      sin reiniciar. Mantiene Claude Code actualizado sin necesidad de
      actualizar la versión del add-on.
  memsearch_enabled:
    name: Habilitar MemSearch (memoria persistente)
    description: >-
      Da a Claude memoria semántica entre sesiones usando un embebedor ONNX
      local y Milvus Lite — nada sale de tu máquina. Al habilitarlo por primera
      vez se instala en un entorno virtual persistente y descarga el modelo de
      embeddings (~558 MB). Requiere arquitectura de 64 bits (amd64 o aarch64).
  memsearch_model:
    name: Modelo de Embeddings de MemSearch
    description: >-
      Modelo de embeddings usado por MemSearch. Por defecto 'bge-m3'
      (multilingüe, ~558 MB). Cámbialo solo si sabes que el modelo es
      compatible con el proveedor ONNX local.

network:
  7681/tcp: Interfaz web (terminal ttyd o code-server, según ui_mode)
